[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-scanner"
version = "0.1.0"
description = "AI-assisted autonomous vulnerability and remediation scanner for Kali/Parrot Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nexus" }]
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "rich>=13.7",
    "textual>=0.60",
    "jinja2>=3.1",
    "docker>=7.0",
    "playwright>=1.44",
]

[project.optional-dependencies]
pdf = ["weasyprint>=61"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
