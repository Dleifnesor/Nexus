[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-scanner"
description = "AI-assisted autonomous vulnerability and remediation scanner for Kali/Parrot Linux"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { text = "MIT" }
authors = [{ name = "Nexus" }]
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "rich>=13.7",
    "textual>=0.60",
    "jinja2>=3.1",
    "docker>=7.0",
    "playwright>=1.44",
]

[project.optional-dependencies]
pdf = ["weasyprint>=61"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus*"]

[tool.setuptools.dynamic]
version = { attr = "nexus.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
